<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEREBRO — Verification Intelligence</title>
    <meta name="theme-color" content="#0B0B0D" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      /*
       * The "Dossier" palette. Components were written against Tailwind's
       * default hues, several of them at once (blue, cyan, purple, emerald...).
       * Remapping the hue families here gives the whole app one restrained
       * palette: slate becomes tuxedo black to ivory, every cool accent becomes
       * brass, green becomes sage, red stays a signal red. One accent, not five.
       */
      const brass = {
        50: '#FBF6EA',
        100: '#F3E8CB',
        200: '#E8D5A3',
        300: '#DCC07D',
        400: '#CFAE66',
        500: '#C2A05A',
        600: '#A6864A',
        700: '#86693A',
        800: '#5E4A2A',
        900: '#3B2F1C',
        950: '#221B11',
      };
      const sage = {
        50: '#F1F6F2',
        100: '#DDE9E0',
        200: '#BFD5C4',
        300: '#9DBDA5',
        400: '#86AD90',
        500: '#6F9A7B',
        600: '#587D63',
        700: '#45624E',
        800: '#2F4436',
        900: '#1E2B22',
        950: '#111913',
      };
      const signal = {
        50: '#FBEFEC',
        100: '#F5D6CF',
        200: '#EAB0A3',
        300: '#DD8774',
        400: '#D2654E',
        500: '#C2412D',
        600: '#A23524',
        700: '#80291C',
        800: '#5C1E15',
        900: '#3B140E',
        950: '#230B08',
      };
      const copper = {
        50: '#FBF2EA',
        100: '#F4DEC9',
        200: '#E8BF98',
        300: '#DCA06C',
        400: '#D08A4E',
        500: '#B9733A',
        600: '#985D2F',
        700: '#764824',
        800: '#523219',
        900: '#33200F',
        950: '#1E1309',
      };
      const ink = {
        50: '#F6F2E9',
        100: '#ECE6D9',
        200: '#D8D1C2',
        300: '#BCB5A7',
        400: '#A29C90',
        500: '#7C776E',
        600: '#5B5852',
        700: '#38363A',
        800: '#222125',
        900: '#151518',
        950: '#0B0B0D',
      };
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: ink,
              gray: ink,
              zinc: ink,
              neutral: ink,
              blue: brass,
              cyan: brass,
              sky: brass,
              indigo: brass,
              purple: brass,
              violet: brass,
              fuchsia: brass,
              pink: copper,
              emerald: sage,
              green: sage,
              teal: sage,
              lime: sage,
              red: signal,
              rose: signal,
              yellow: brass,
              amber: brass,
              orange: copper,
              brass,
              sage,
              signal,
              copper,
              ink,
            },
            fontFamily: {
              sans: ['"Instrument Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
              display: ['"Bodoni Moda"', 'Georgia', 'serif'],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
